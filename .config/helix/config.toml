theme = "gruvbox_transparent"

[editor]
line-number = "relative"
cursorline = true
color-modes = true
bufferline = "multiple"

end-of-line-diagnostics = "info"
inline-diagnostics = { cursor-line = "warning" }

trim-trailing-whitespace = true

[editor.whitespace]
render = "all"
[editor.whitespace.characters]
space = " "

[editor.cursor-shape]
insert = "bar"

[keys.normal]
H = ["collapse_selection", "extend_to_line_start"]
L = ["collapse_selection", "extend_to_line_end"]
C-h = "jump_view_left"
C-j = "jump_view_down"
C-k = "jump_view_up"
C-l = "jump_view_right"
y = "yank_joined"
space = { y = "yank_joined_to_clipboard" }

[keys.select]
H = "goto_line_start"
L = "goto_line_end"
y = "yank_joined"
space = { y = "yank_joined_to_clipboard" }
