# Only tmux has a grammar outside the system/release set, so hx --grammar
# fetch/build stays one small clone instead of all ~250 built-in grammars.
use-grammars = { only = ["tmux"] }

[language-server.biome]
command = "biome"
args = ["lsp-proxy"]

[[language]]
name = "ini"
file-types = [
  "ini",
  "desktop",
  { glob = "mimeapps.list" },
  { glob = ".editorconfig" },
  { glob = ".npmrc" },
  "properties",
  "cfg",
  "directory",
  # Custom appends
  { glob = "plank/themes/*.theme" },
]

[[language]]
name = "bash"
file-types = [
  "sh",
  "bash",
  { glob = ".bash*" },
  { glob = ".profile" },
  { glob = ".xprofile" },
  { glob = ".xsession*" },
  # Custom appends
  { glob = ".config/profile" },
  { glob = ".config/bash/*" },
]

[language-server.bash-language-server.config.bashIde.shfmt]
caseIndent = true

[[language]]
name = "tmux"
scope = "source.tmux"
comment-token = "#"
file-types = [
  ".tmux",
  { glob = "tmux/*.conf" },
  { glob = "tmux/conf.d/*.conf" },
]

# Pinned, not "main": the tracked runtime/queries/tmux files are this
# revision's queries with gruvbox scope names, and the next commit renames
# nodes they reference (:boom: inject format string by tmuxf). A rev bump here
# means re-copying that revision's queries.
[[grammar]]
name = "tmux"
source = { git = "https://github.com/Freed-Wu/tree-sitter-tmux", rev = "0507eeb340c91f67713c711cdad54e1a3fb6e2e0" }

[[language]]
name = "nu"
formatter = { command = "nufmt", args = [ "--stdin" ] }
indent = { tab-width = 4, unit = "    " }

[language-server.taplo]
config = {}

[[language]]
name = "git-config"
file-types = [
  "gitconfig",
  { glob = ".gitmodules" },
  { glob = ".gitconfig" },
  { glob = ".git/config" },
  { glob = ".config/git/config" },
  # Custom appends
  { glob = ".config/git/*.config" },
]
formatter = { command = "gitconfig-fmt" }
auto-format = true

[[language]]
name = "json"
language-servers = ["biome"]

[[language]]
name = "jsonc"
language-servers = ["biome"]

[[language]]
name = "markdown"
soft-wrap = { enable = true, wrap-indicator = "" }

[language-server.ty]
config = { experimental = { useUv = "scripts" } }
