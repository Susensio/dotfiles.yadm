set-environment -ghF TMUX_CONFIG_DIR "#{d:current_file}"
set-environment -ghF TMUX_SCRIPTS_DIR "#{d:current_file}/scripts"
set-environment -ghF BIN_HOME "#{HOME}/bin"


# -F here (and on set-environment above) captures #{d:current_file} as a
# runtime format read at each use; %hidden can't do this since its values
# are only visible to $VAR at parse time, not to later #{} lookups.
# rationale: docs/adr/0010-self-locating-tmux-conf.md
source -F "#{TMUX_CONFIG_DIR}/conf.d/*.conf"
