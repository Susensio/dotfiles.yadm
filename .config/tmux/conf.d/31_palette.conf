# Gruvbox defaults; Omarchy overrides roles when its generated palette exists.
set-environment -gh PANE_BG "$BG0"
set-environment -gh PANE_FG "$FG0"
set-environment -gh PANE_INACTIVE_BG "$BG_INACTIVE"
set-environment -gh PANE_INACTIVE_FG "$FG1"
set-environment -gh POPUP_BG "$BG0"
set-environment -gh POPUP_FG "$FG0"
set-environment -gh CURSOR "$FG0"
set-environment -gh BORDER_MUTED "$FG4"
set-environment -gh BORDER_MODE "$YELLOW"
set-environment -gh BORDER_SYNC "$RED"
set-environment -gh BORDER_NORMAL "$BR_GREEN"
set-environment -gh MARK_FG "$BG0"
set-environment -gh STATUS_BG "$BG1"
set-environment -gh STATUS_FG "$FG"
set-environment -gh STATUS_MUTED "$FG4"
set-environment -gh SESSION_BG "$FG3"
set-environment -gh SESSION_FG "$BG0"
set-environment -gh NORMAL_BG "$BG2"
set-environment -gh NORMAL_FG "$FG3"
set-environment -gh ACTIVE_BG "$GREEN"
set-environment -gh ACTIVE_FG "$BG0"
set-environment -gh MODE_BG "$YELLOW"
set-environment -gh SELECT_BG "$BR_PURPLE"
set-environment -gh BADGE_FG "$BG0"
set-environment -gh PREFIX_BG "$BLUE"
set-environment -gh PREFIX_ACTIVE_BG "$BR_BLUE"
set-environment -gh MESSAGE_BG "$DIM_YELLOW"
set-environment -gh MESSAGE_FG "$BG0"

# The optional file is rendered on each Omarchy theme change.
source-file -q "$HOME/.local/state/omarchy/current/theme/tmux-palette.conf"
