# tpack per docs/adr/0061; I / U / M-u reclaimed per docs/adr/0016.
set -g @tpack-tui 'S-Left'
# Only tpack's errors (stderr): its progress, every plugin it already has, would
# read as errors to reload-config's dry run (docs/adr/0017)
if "command -v mise && printf '%s' '#{config_files}' | grep -q tmux.conf" \
   "run 'mise exec -- tpack install 2>&1 >/dev/null && mise exec -- tpack init'"

unbind -T prefix I
unbind -T prefix U
unbind -T prefix M-u
unbind -T prefix S-Left

set -a command-alias install-plugins="run 'mise exec -- tpack install'"
set -a command-alias update-plugins="run 'mise exec -- tpack update'"
set -a command-alias clean-plugins="run 'mise exec -- tpack clean'"

bind -T config -N "Install plugins" I   "install-plugins"
bind -T config -N "Update plugins"  U   "update-plugins"
bind -T config -N "Clean plugins"   M-u "clean-plugins"
bind -T config -N "Plugins TUI"     T   "display-popup -E 'mise exec -- tpack tui'"
