%if "#{m:*_scratchpad,#{b:socket_path}}"
    set -g status off
    set -g pane-border-status off
    set -g detach-on-destroy on
    # Unguarded, `detach` leaves "(null):0: no current client" for the next client -- tmux/tmux#5528
    set-hook -ga window-unlinked { if -F "#{session_attached}" "detach" }
    set -g remain-on-exit off

    # Delegate to parent
    bind -N "SESSION..." S detach \; run "tmux -S '#{s/_scratchpad$//:socket_path}' switch-client -T session \; tmux -S '#{s/_scratchpad$//:socket_path}' which-key"
%else
    # Auto close children scratchpad
    set-hook -ga session-closed "run '$TMUX_SCRIPTS_DIR/scratchpad clean --session #{q:hook_session}'"
%endif
