# Fix numbering
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Show tmux positions in titles
set -g set-titles on

set -g automatic-rename on

# #{session_path} is empty under automatic-rename (tmux/tmux#3808). No
# format recovers it -- stash it per window at creation instead.
set-hook -g after-new-session 'set -wF @root "#{session_path}"'
set-hook -g after-new-window  'set -wF @root "#{session_path}"'

# Padded with spaces so the regexes match whole commands, not "top" in "topgrade".
%hidden PANE_CMDS="#{P: #{pane_current_command} }"

set -g automatic-rename-format ""
set -ga automatic-rename-format "#{?#{m/r: (claude|agy) ,$PANE_CMDS},AGENT,"
set -ga automatic-rename-format "#{?#{m/r: (nvim|vim|hx|lvim|emacs) ,$PANE_CMDS},EDIT,"
set -ga automatic-rename-format "#{?#{m/r: (lazygit|gitui|tig|git) ,$PANE_CMDS},GIT,"
set -ga automatic-rename-format "#{?#{m/r: (docker|docker-compose|npm|vite|next|nodemon|uvicorn|gunicorn|caddy|nginx) ,$PANE_CMDS},SERVER,"
set -ga automatic-rename-format "#{?#{m/r: (htop|btop|top|glances|mactop) ,$PANE_CMDS},MONITOR,"
set -ga automatic-rename-format "#{?#{m/r: (less|tail|multitail|journalctl|lnav) ,$PANE_CMDS},LOGS,"
# The root itself collapses to "./", since the session name names it.
set -ga automatic-rename-format "#{?@root,#{s|^#{@root}/?|./|:pane_current_path},#{b:pane_current_path}}"
# One "}" per rule above: add a rule, add a brace.
set -ga automatic-rename-format "}}}}}}"

# Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g status-interval 1

# Monitor activity and bell signals
set -g monitor-activity on
set -g monitor-bell on
# but do not show tmux messages for them
set -g visual-activity off
set -g visual-bell off
# activity only used for window-style
set -g activity-action none
# bell for unfocused windows ring
set -g bell-action any

set-hook -g alert-bell 'run-shell -b "$TMUX_SCRIPTS_DIR/bell-flash #{session_attached}"'

# Increase tmux messages display duration from 750ms to 2s
set -g display-time 2000
# Increase panes numbering timeout
set -g display-panes-time 1500
# Focus events enabled for terminals that support them
set -g focus-events on

# Terminal title
set -g set-titles-string ''
# @session_pretty_name is set by scripts/sessionizer for directory-backed sessions.
set -ga set-titles-string '[#{?@session_pretty_name,#{@session_pretty_name},#S}]'
set -ga set-titles-string ' '
set -ga set-titles-string '#I:#W'
set -ga set-titles-string ' - '
set -ga set-titles-string '"#T"'
set -ga set-titles-string ' '
set -ga set-titles-string '#{session_alerts}'

# Better pane borders
set -g pane-border-status top
set -g pane-border-indicators off
set -g pane-border-style fg=$FG4
# Active border doubles as a status signal: yellow = pane in a mode
# (copy/view), red = synchronized-panes on, green = normal.
set -g pane-active-border-style "#{?pane_in_mode,fg=$YELLOW,#{?synchronize-panes,fg=$RED,fg=$BR_GREEN}}"

# Pane border: index, then scripts/pane-title builds icon + command + title
# (stripping the command name back out of the title first -- see the script).
set -g pane-border-format ""
set -ga pane-border-format "#{?pane_active,#[reverse],}#{pane_index}#[default] "
set -ga pane-border-format "#(#{TMUX_SCRIPTS_DIR}/pane-title #{q:pane_current_command} #{q:pane_title} ': ') "
set -ga pane-border-format "#{?#{mouse},#[align=right]#{?#{>:#{window_panes},1},#[range=control|8][#{?#{window_zoomed_flag},u,z}]#[norange],}#[range=control|9][x]#[norange],}"


# Statusbar colors
%hidden BG=$BG0
%hidden BLACK=$BG0
%hidden WHITE=$FG0
%hidden STATUS_BG=$BG1
%hidden SESSION_BG=$FG3
%hidden SESSION_FG=$BG0
%hidden NORMAL_BG=$BG2
%hidden NORMAL_FG=$FG3
%hidden ACTIVE_BG=$GREEN
%hidden ACTIVE_FG=$BG0


%hidden LEFT_TAB_SEPARATOR="◣"
%hidden RIGHT_TAB_SEPARATOR="◢"
%hidden ZOOM_OPEN="#{?window_zoomed_flag,(, }"
%hidden ZOOM_CLOSE="#{?window_marked_flag,∑,#{?window_zoomed_flag,), }}"

# Bell badge for detached sessions (no client there to flash/ring).
# Click uses the existing MouseDown1Status binding to switch to it.
%hidden BELL_TRAY="#{?#{S:#{?#{&&:#{==:#{session_attached},0},#{session_bell_flag}},x,}},#[range=control|7]  #[norange]#[default],}"

set -g window-style fg=$FG1,bg=$BG_INACTIVE
set -g window-active-style fg=$FG0,bg=$BG0
set -g popup-style fg=$FG0,bg=$BG0

# STATUS BAR
set -g status-style fg=$FG,bg=$STATUS_BG

set -g status-left-length 35
set -g status-left ""
set -ga status-left "#[bg=$SESSION_BG,fg=$SESSION_FG,bold]"
set -ga status-left " "
set -ga status-left "#{?@session_pretty_name,#{@session_pretty_name},#S}"
set -ga status-left " "
set -ga status-left "#[bg=$STATUS_BG,nobold]"
set -ga status-left "  "

# WINDOWS
# Status line like tabs
# with zoom indicator ()

set -g window-status-activity-style 'italics'
# default here to not mess up the separators, applied only to text with window-status-format
set -g window-status-bell-style "default"

# *-style does not allow conditionals, using embedded styles in format
set -g window-status-style bg=$NORMAL_BG
set -g window-status-format ""

set -ga window-status-format "#[fg=$STATUS_BG]"
set -ga window-status-format "$LEFT_TAB_SEPARATOR"
set -ga window-status-format "#{?window_bell_flag,#[blink]#[bold]}"
set -ga window-status-format "#[fg=$NORMAL_FG]"
set -ga window-status-format "$ZOOM_OPEN"
set -ga window-status-format "#I:#W"
set -ga window-status-format "$ZOOM_CLOSE"
set -ga window-status-format "#[noblink,nobold]"
set -ga window-status-format "#[fg=$STATUS_BG]"
set -ga window-status-format "$RIGHT_TAB_SEPARATOR"

set -g window-status-current-style bg=$ACTIVE_BG
set -g window-status-current-format ""

set -ga window-status-current-format "#[fg=$STATUS_BG]"
set -ga window-status-current-format "$LEFT_TAB_SEPARATOR"
set -ga window-status-current-format "#[fg=$ACTIVE_FG]"
set -ga window-status-current-format "$ZOOM_OPEN"
set -ga window-status-current-format "#[]"
set -ga window-status-current-format "#I:#W"
set -ga window-status-current-format "#[bg=$ACTIVE_BG,nobold]"
set -ga window-status-current-format "$ZOOM_CLOSE"
set -ga window-status-current-format "#[fg=$STATUS_BG]"
set -ga window-status-current-format "$RIGHT_TAB_SEPARATOR"
set -g window-status-separator ''

# RIGHT
set -g status-right-style bg=$STATUS_BG,fg=$FG4
set -g status-right ""
# Copy/view mode, and select mode (21_copy.conf's @copy_select) within it,
# don't show up in client_key_table -- that tracks root/prefix/custom -T
# tables; pane modes dispatch separately. Hence its own segment.
set -ga status-right "#{?pane_in_mode,#[bg=#{?@copy_select,$BR_PURPLE,$YELLOW}]#[fg=$BG0]#[bold] #{?@copy_select,select,#{pane_mode}} #[default] ,}"
set -ga status-right "#{?#{!=:#{client_key_table},root},#[bg=#{?#{==:#{client_key_table},prefix},$BR_BLUE,$BLUE}]#[fg=$BG0]#[bold] #{client_key_table} #[default] ,}"
set -ga status-right "$BELL_TRAY"
set -ga status-right " %H:%M "

# COMMAND MODE
#
# A unified style covers both command-prompt and notifications.
set -g message-style  "fg=$BLACK,bg=$DIM_YELLOW,fill=$DIM_YELLOW"
set -g message-format "#[#{message-style}]#{message}"

# TODO: In tmux 3.8, uncomment the following line to restore right-aligned notifications
# without needing complex aliases, thanks to the new prompt_input variable.
# set -g message-format "#{?prompt_input,#[align=left]#[width=100%],#[align=right]#[width=40%]}#[#{message-style}] #{message} "

if-shell -b 'tmux -V | grep -qE "master|3\.[89]|4\.[0-9]"' {
    run-shell "tmux display-message -d 10000 'Tmux >= 3.8 detected! Enable prompt_input in 31_visual.conf!'"
}
# Plain #{...}, not #{E:...}. E: is a second format-expansion pass, and
# these values are hex-colour styles ("fg=#282828,..."). The second pass
# misreads the literal '#' as a format specifier, and the whole thing comes
# back empty.
set -g prompt-cursor-color $BLACK
set -g prompt-cursor-style bar
