# command-prompt and display-message share one message-style/message-format
# pair; they aren't styled differently yet. Style-swapping needs
# prompt_input (tmux >=3.8) -- see the TODO in 31_visual.conf.
set -a command-alias notify='display-message'

set -a command-alias last-session='switch-client -l'
# Arms the menu for the table the client just entered: #{client_key_table} is
# already the destination wherever this runs, a -r key's own table included.
set -a command-alias which-key="run -b '$TMUX_SCRIPTS_DIR/which-key #{client_key_table} #{client_name} 2>&1'"
set -a command-alias reload-config="run '$TMUX_SCRIPTS_DIR/reload-config 2>&1'"
set -a command-alias new-split="run '$TMUX_SCRIPTS_DIR/new-split 2>&1'"
set -a command-alias sessionizer="run '$TMUX_SCRIPTS_DIR/sessionizer 2>&1'"
set -a command-alias scratchpad="run '$TMUX_SCRIPTS_DIR/scratchpad --client #{client_tty} 2>&1'"
set -a command-alias man="run '$TMUX_SCRIPTS_DIR/scratchpad --client #{client_tty} --name man $BIN_HOME/f-man 2>&1'"
set -a command-alias lazygit="run '$TMUX_SCRIPTS_DIR/scratchpad --client #{client_tty} --name lazygit $TMUX_SCRIPTS_DIR/_lazygit 2>&1'"
