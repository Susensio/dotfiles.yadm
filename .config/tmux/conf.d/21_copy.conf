# ==============================================================================
# 21_copy.conf - Vi & Helix modal copy-mode configuration
# ==============================================================================

set -g mode-keys vi

# Disabled: copy-pipe can conflict with this
set -s set-clipboard off

# ── PROFILE (vim vs helix) ────────────────────────────────────────────────────
# Picks vim or helix motions -- shared bindings follow below.
# Rationale: docs/adr/0014-keep-vim-and-helix-copy-mode.md
# %hidden, not a user option: %if is evaluated while the file is still being
# parsed, so a `set -g` earlier in this same file has not run yet and the
# helix branch silently falls through to vim. $VAR is the only value visible
# that early. The option below is for the status line and for reading back.
%hidden COPY_PROFILE=helix
set -g @copy_profile $COPY_PROFILE

# SELECT MODE -- helix only; vim branch never reads @copy_select.
# Reset on every fresh entry into copy-mode.
set-hook -g pane-mode-changed 'if -F "#{==:#{pane_mode},copy-mode}" { set -p @copy_select 0 }'

%if "#{==:$COPY_PROFILE,helix}"
  # ── HELIX PROFILE ───────────────────────────────────────────────────────────
  # Select (extend) mode toggle
  bind -T copy-mode-vi v { if -F "#{@copy_select}" { set -p @copy_select 0 } { set -p @copy_select 1 ; if -F "#{!:#{selection_present}}" { send-keys -X begin-selection } } }

  # Escape leaves copy-mode outright; only select mode swallows it, to drop
  # back to normal mode. A selection made outside select mode (w, x, mi...) is
  # not a mode, so there is nothing for Escape to return to -- it exits.
  bind -T copy-mode-vi Escape { if -F "#{@copy_select}" { send-keys -X clear-selection ; set -p @copy_select 0 } { send-keys -X cancel } }

  # Collapse selection / Select buffer
  bind -T copy-mode-vi ';' { send-keys -X clear-selection ; set -p @copy_select 0 }
  bind -T copy-mode-vi '%' { send-keys -X clear-selection ; send-keys -X history-top ; send-keys -X begin-selection ; send-keys -X history-bottom ; send-keys -X end-of-line }

  # Word & WORD motions (select span in normal mode; extend in select mode)
  bind -T copy-mode-vi w { if -F "#{!:#{@copy_select}}" { if -F "#{selection_present}" { send-keys -X clear-selection ; send-keys -X cursor-right } ; send-keys -X begin-selection } { if -F "#{selection_present}" { send-keys -X cursor-right } } ; send-keys -X next-word ; send-keys -X cursor-left }
  bind -T copy-mode-vi b { if -F "#{!:#{@copy_select}}" { send-keys -X clear-selection ; send-keys -X begin-selection } ; send-keys -X previous-word }
  bind -T copy-mode-vi e { if -F "#{!:#{@copy_select}}" { send-keys -X clear-selection ; send-keys -X begin-selection } ; send-keys -X next-word-end }
  bind -T copy-mode-vi W { if -F "#{!:#{@copy_select}}" { if -F "#{selection_present}" { send-keys -X clear-selection ; send-keys -X cursor-right } ; send-keys -X begin-selection } { if -F "#{selection_present}" { send-keys -X cursor-right } } ; send-keys -X next-space ; send-keys -X cursor-left }
  bind -T copy-mode-vi B { if -F "#{!:#{@copy_select}}" { send-keys -X clear-selection ; send-keys -X begin-selection } ; send-keys -X previous-space }
  bind -T copy-mode-vi E { if -F "#{!:#{@copy_select}}" { send-keys -X clear-selection ; send-keys -X begin-selection } ; send-keys -X next-space-end }

  # Directional movements (collapse in normal mode; extend in select mode)
  bind -T copy-mode-vi h { if -F "#{@copy_select}" { if -F "#{!:#{selection_present}}" { send-keys -X begin-selection } } { if -F "#{selection_present}" { send-keys -X clear-selection } } ; send-keys -X cursor-left }
  bind -T copy-mode-vi j { if -F "#{@copy_select}" { if -F "#{!:#{selection_present}}" { send-keys -X begin-selection } } { if -F "#{selection_present}" { send-keys -X clear-selection } } ; send-keys -X cursor-down }
  bind -T copy-mode-vi k { if -F "#{@copy_select}" { if -F "#{!:#{selection_present}}" { send-keys -X begin-selection } } { if -F "#{selection_present}" { send-keys -X clear-selection } } ; send-keys -X cursor-up }
  bind -T copy-mode-vi l { if -F "#{@copy_select}" { if -F "#{!:#{selection_present}}" { send-keys -X begin-selection } } { if -F "#{selection_present}" { send-keys -X clear-selection } } ; send-keys -X cursor-right }

  # Line boundary motions (H to line start, L to line end)
  bind -T copy-mode-vi H { if -F "#{@copy_select}" { if -F "#{!:#{selection_present}}" { send-keys -X begin-selection } } { if -F "#{selection_present}" { send-keys -X clear-selection } ; send-keys -X begin-selection } ; send-keys -X start-of-line }
  bind -T copy-mode-vi L { if -F "#{@copy_select}" { if -F "#{!:#{selection_present}}" { send-keys -X begin-selection } } { if -F "#{selection_present}" { send-keys -X clear-selection } ; send-keys -X begin-selection } ; send-keys -X end-of-line }

  # Line selection (x selects/accumulates lines)
  bind -T copy-mode-vi x { if -F "#{&&:#{selection_present},#{==:#{selection_mode},line}}" { send-keys -X cursor-down } { send-keys -X select-line } }
  unbind -T copy-mode-vi X
  unbind -T copy-mode-vi V
  unbind -T copy-mode-vi 'C-v'

  # tmux has one selection; C starts a rectangle instead of Helix's cursors.
  bind -T copy-mode-vi C { send-keys -X clear-selection ; set -p @copy_select 1 ; send-keys -X begin-selection ; send-keys -X rectangle-on }

  # Yank actions (y / Y yanks current selection to clipboard)
  bind -T copy-mode-vi y { if -F "#{selection_active}" { send-keys -X copy-pipe-and-cancel } { send-keys -X begin-selection ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel } }
  bind -T copy-mode-vi Y { if -F "#{selection_active}" { send-keys -X copy-pipe-and-cancel } { send-keys -X begin-selection ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel } }

  # Match mode: mi<obj> / ma<obj> / mm
  unbind -T copy-mode-vi i
  unbind -T copy-mode-vi a
  bind -T copy-mode-vi m switch-client -T match
  bind -T match i switch-client -T extend-inner
  bind -T match a switch-client -T extend-around
  bind -T match m send-keys -X next-matching-bracket
  bind -T match % send-keys -X next-matching-bracket
%else
  # ── VIM PROFILE ─────────────────────────────────────────────────────────────
  bind -T copy-mode-vi Escape { if -F "#{selection_present}" { send-keys -X clear-selection } { send-keys -X cancel } }
  bind -T copy-mode-vi v send-keys -X begin-selection
  bind -T copy-mode-vi V send-keys -X select-line
  bind -T copy-mode-vi 'C-v' { send-keys -X begin-selection ; send-keys -X rectangle-toggle }

  bind -T copy-mode-vi y { if -F "#{selection_active}" { send-keys -X copy-pipe-and-cancel } { switch-client -T yank } }
  bind -T copy-mode-vi Y { send-keys -X select-line ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }

  # Operator-pending yank table (Vim)
  bind -T yank y   { send-keys -X select-line ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }
  bind -T yank w   { send-keys -X begin-selection ; send-keys -X next-word ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }
  bind -T yank W   { send-keys -X begin-selection ; send-keys -X next-space ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }
  bind -T yank '$' { send-keys -X begin-selection ; send-keys -X end-of-line ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }
  bind -T yank p   { send-keys -X clear-selection ; send-keys -X previous-prompt ; send-keys -X next-prompt -o ; send-keys -X begin-selection ; send-keys -X next-prompt ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }

  bind -T yank i switch-client -T yank-inner
  bind -T yank a switch-client -T yank-around

  # Yank inner
  bind -T yank-inner w   { send-keys -X select-word ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }
  bind -T yank-inner W   { send-keys -X clear-selection ; send-keys -X next-space-end ; send-keys -X previous-space ; send-keys -X begin-selection ; send-keys -X next-space-end ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }
  bind -T yank-inner p   { send-keys -X clear-selection ; send-keys -X previous-prompt ; send-keys -X next-prompt -o ; send-keys -X begin-selection ; send-keys -X next-prompt ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }
  bind -T yank-inner '(' { send-keys -X clear-selection ; send-keys -X jump-backward '(' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward ')' ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }
  bind -T yank-inner ')' { send-keys -X clear-selection ; send-keys -X jump-backward '(' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward ')' ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }
  bind -T yank-inner b   { send-keys -X clear-selection ; send-keys -X jump-backward '(' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward ')' ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }
  bind -T yank-inner '[' { send-keys -X clear-selection ; send-keys -X jump-backward '[' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward ']' ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }
  bind -T yank-inner ']' { send-keys -X clear-selection ; send-keys -X jump-backward '[' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward ']' ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }
  bind -T yank-inner '{' { send-keys -X clear-selection ; send-keys -X jump-backward '{' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward '}' ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }
  bind -T yank-inner '}' { send-keys -X clear-selection ; send-keys -X jump-backward '{' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward '}' ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }
  bind -T yank-inner B   { send-keys -X clear-selection ; send-keys -X jump-backward '{' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward '}' ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }
  bind -T yank-inner '<' { send-keys -X clear-selection ; send-keys -X jump-backward '<' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward '>' ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }
  bind -T yank-inner '>' { send-keys -X clear-selection ; send-keys -X jump-backward '<' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward '>' ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }
  bind -T yank-inner '"' { send-keys -X clear-selection ; send-keys -X jump-backward '"' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward '"' ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }
  bind -T yank-inner "'" { send-keys -X clear-selection ; send-keys -X jump-backward "'" ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward "'" ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }
  bind -T yank-inner '`' { send-keys -X clear-selection ; send-keys -X jump-backward '`' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward '`' ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }
  bind -T yank-inner q   { send-keys -X clear-selection ; send-keys -X jump-backward '"' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward '"' ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }

  # Yank around
  bind -T yank-around w   { send-keys -X clear-selection ; send-keys -X next-word-end ; send-keys -X previous-word ; send-keys -X begin-selection ; send-keys -X next-word ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }
  bind -T yank-around W   { send-keys -X clear-selection ; send-keys -X previous-space ; send-keys -X begin-selection ; send-keys -X next-space ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }
  bind -T yank-around p   { send-keys -X clear-selection ; send-keys -X previous-prompt ; send-keys -X begin-selection ; send-keys -X next-prompt ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }
  bind -T yank-around '(' { send-keys -X clear-selection ; send-keys -X jump-backward '(' ; send-keys -X begin-selection ; send-keys -X jump-forward ')' ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }
  bind -T yank-around ')' { send-keys -X clear-selection ; send-keys -X jump-backward '(' ; send-keys -X begin-selection ; send-keys -X jump-forward ')' ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }
  bind -T yank-around b   { send-keys -X clear-selection ; send-keys -X jump-backward '(' ; send-keys -X begin-selection ; send-keys -X jump-forward ')' ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }
  bind -T yank-around '[' { send-keys -X clear-selection ; send-keys -X jump-backward '[' ; send-keys -X begin-selection ; send-keys -X jump-forward ']' ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }
  bind -T yank-around ']' { send-keys -X clear-selection ; send-keys -X jump-backward '[' ; send-keys -X begin-selection ; send-keys -X jump-forward ']' ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }
  bind -T yank-around '{' { send-keys -X clear-selection ; send-keys -X jump-backward '{' ; send-keys -X begin-selection ; send-keys -X jump-forward '}' ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }
  bind -T yank-around '}' { send-keys -X clear-selection ; send-keys -X jump-backward '{' ; send-keys -X begin-selection ; send-keys -X jump-forward '}' ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }
  bind -T yank-around B   { send-keys -X clear-selection ; send-keys -X jump-backward '{' ; send-keys -X begin-selection ; send-keys -X jump-forward '}' ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }
  bind -T yank-around '<' { send-keys -X clear-selection ; send-keys -X jump-backward '<' ; send-keys -X begin-selection ; send-keys -X jump-forward '>' ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }
  bind -T yank-around '>' { send-keys -X clear-selection ; send-keys -X jump-backward '<' ; send-keys -X begin-selection ; send-keys -X jump-forward '>' ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }
  bind -T yank-around '"' { send-keys -X clear-selection ; send-keys -X jump-backward '"' ; send-keys -X begin-selection ; send-keys -X jump-forward '"' ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }
  bind -T yank-around "'" { send-keys -X clear-selection ; send-keys -X jump-backward "'" ; send-keys -X begin-selection ; send-keys -X jump-forward "'" ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }
  bind -T yank-around '`' { send-keys -X clear-selection ; send-keys -X jump-backward '`' ; send-keys -X begin-selection ; send-keys -X jump-forward '`' ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }
  bind -T yank-around q   { send-keys -X clear-selection ; send-keys -X jump-backward '"' ; send-keys -X begin-selection ; send-keys -X jump-forward '"' ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }

  # Text objects via bare i/a in Visual mode (viw, vaw, vip, vap, etc.)
  unbind -T copy-mode-vi m
  bind -T copy-mode-vi i { if -F "#{selection_active}" { switch-client -T extend-inner } }
  bind -T copy-mode-vi a { if -F "#{selection_active}" { switch-client -T extend-around } }
%endif

# ── TEXT OBJECTS (shared) ─────────────────────────────────────────────────────
# Word / WORD text objects
bind -T extend-inner w  { send-keys -X select-word }
bind -T extend-inner W  { send-keys -X clear-selection ; send-keys -X next-space-end ; send-keys -X previous-space ; send-keys -X begin-selection ; send-keys -X next-space-end }
bind -T extend-around w { send-keys -X clear-selection ; send-keys -X next-word-end ; send-keys -X previous-word ; send-keys -X begin-selection ; send-keys -X next-word }
bind -T extend-around W { send-keys -X clear-selection ; send-keys -X previous-space ; send-keys -X begin-selection ; send-keys -X next-space }

# Prompt text objects (mip/yip = command output, map/yap = prompt + output)
bind -T extend-inner p  { send-keys -X clear-selection ; send-keys -X previous-prompt ; send-keys -X next-prompt -o ; send-keys -X begin-selection ; send-keys -X next-prompt }
bind -T extend-around p { send-keys -X clear-selection ; send-keys -X previous-prompt ; send-keys -X begin-selection ; send-keys -X next-prompt }

# Brackets: () / [] / {} / <>
bind -T extend-inner '(' { send-keys -X clear-selection ; send-keys -X jump-backward '(' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward ')' }
bind -T extend-inner ')' { send-keys -X clear-selection ; send-keys -X jump-backward '(' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward ')' }
bind -T extend-inner b   { send-keys -X clear-selection ; send-keys -X jump-backward '(' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward ')' }
bind -T extend-around '(' { send-keys -X clear-selection ; send-keys -X jump-backward '(' ; send-keys -X begin-selection ; send-keys -X jump-forward ')' }
bind -T extend-around ')' { send-keys -X clear-selection ; send-keys -X jump-backward '(' ; send-keys -X begin-selection ; send-keys -X jump-forward ')' }
bind -T extend-around b   { send-keys -X clear-selection ; send-keys -X jump-backward '(' ; send-keys -X begin-selection ; send-keys -X jump-forward ')' }

bind -T extend-inner '[' { send-keys -X clear-selection ; send-keys -X jump-backward '[' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward ']' }
bind -T extend-inner ']' { send-keys -X clear-selection ; send-keys -X jump-backward '[' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward ']' }
bind -T extend-around '[' { send-keys -X clear-selection ; send-keys -X jump-backward '[' ; send-keys -X begin-selection ; send-keys -X jump-forward ']' }
bind -T extend-around ']' { send-keys -X clear-selection ; send-keys -X jump-backward '[' ; send-keys -X begin-selection ; send-keys -X jump-forward ']' }

bind -T extend-inner '{' { send-keys -X clear-selection ; send-keys -X jump-backward '{' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward '}' }
bind -T extend-inner '}' { send-keys -X clear-selection ; send-keys -X jump-backward '{' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward '}' }
bind -T extend-inner B   { send-keys -X clear-selection ; send-keys -X jump-backward '{' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward '}' }
bind -T extend-around '{' { send-keys -X clear-selection ; send-keys -X jump-backward '{' ; send-keys -X begin-selection ; send-keys -X jump-forward '}' }
bind -T extend-around '}' { send-keys -X clear-selection ; send-keys -X jump-backward '{' ; send-keys -X begin-selection ; send-keys -X jump-forward '}' }
bind -T extend-around B   { send-keys -X clear-selection ; send-keys -X jump-backward '{' ; send-keys -X begin-selection ; send-keys -X jump-forward '}' }

bind -T extend-inner '<' { send-keys -X clear-selection ; send-keys -X jump-backward '<' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward '>' }
bind -T extend-inner '>' { send-keys -X clear-selection ; send-keys -X jump-backward '<' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward '>' }
bind -T extend-around '<' { send-keys -X clear-selection ; send-keys -X jump-backward '<' ; send-keys -X begin-selection ; send-keys -X jump-forward '>' }
bind -T extend-around '>' { send-keys -X clear-selection ; send-keys -X jump-backward '<' ; send-keys -X begin-selection ; send-keys -X jump-forward '>' }

# Quotes: "" / '' / ``
bind -T extend-inner '"' { send-keys -X clear-selection ; send-keys -X jump-backward '"' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward '"' }
bind -T extend-around '"' { send-keys -X clear-selection ; send-keys -X jump-backward '"' ; send-keys -X begin-selection ; send-keys -X jump-forward '"' }
bind -T extend-inner "'" { send-keys -X clear-selection ; send-keys -X jump-backward "'" ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward "'" }
bind -T extend-around "'" { send-keys -X clear-selection ; send-keys -X jump-backward "'" ; send-keys -X begin-selection ; send-keys -X jump-forward "'" }
bind -T extend-inner '`' { send-keys -X clear-selection ; send-keys -X jump-backward '`' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward '`' }
bind -T extend-around '`' { send-keys -X clear-selection ; send-keys -X jump-backward '`' ; send-keys -X begin-selection ; send-keys -X jump-forward '`' }
bind -T extend-inner q   { send-keys -X clear-selection ; send-keys -X jump-backward '"' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward '"' }
bind -T extend-around q  { send-keys -X clear-selection ; send-keys -X jump-backward '"' ; send-keys -X begin-selection ; send-keys -X jump-forward '"' }

# ── PROMPT NAVIGATION (shared) ────────────────────────────────────────────────
bind -T copy-mode-vi "[" send-keys -X previous-prompt
bind -T copy-mode-vi "]" send-keys -X next-prompt
bind -T copy-mode-vi "{" send-keys -X previous-prompt -o
bind -T copy-mode-vi "}" send-keys -X next-prompt -o

# ── COPY / PASTE (shared) ─────────────────────────────────────────────────────
set -s copy-command 'clipboard copy --selection clipboard'
# Mouse-based copies use the primary selection instead -- see 22_mouse.conf

bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel

# Paste clipboard cleanly via pipe to avoid shell escaping issues
bind -N "Paste clipboard" P run-shell "clipboard paste --selection clipboard | tmux load-buffer -b clipboard_selection - && tmux paste-buffer -d -b clipboard_selection"

# ── SEARCH ────────────────────────────────────────────────────────────────────
set -g wrap-search on
# Incremental search
bind -T copy-mode-vi / command-prompt -i -p "(search down)" { send-keys -X search-forward-incremental "%%%" }
bind -T copy-mode-vi ? command-prompt -i -p "(search up)" { send-keys -X search-backward-incremental "%%%" }
# Shortcut (search backward into scrollback)
bind -N "Search" / copy-mode \; send-keys ?

# ── URL HANDLING ──────────────────────────────────────────────────────────────
# U searches backward for the nearest plain-text URL above cursor
bind -T copy-mode-vi U send-keys -X search-backward -- "(https?://|git@|git://|ssh://|ftp://|file:///)[[:alnum:]?=%/_.:,;~@!#$&()*+-]*"

# Open URL under cursor (prefers OSC 8 hyperlinks, falls back to regex extract)
bind -T copy-mode-vi O {
  if -F "#{copy_cursor_hyperlink}" {
    run-shell -b "xdg-open #{q:copy_cursor_hyperlink} >/dev/null 2>&1"
    send-keys -X cancel
  } {
    send-keys -X next-space-end
    send-keys -X previous-space
    send-keys -X begin-selection
    send-keys -X next-space-end
    send-keys -X copy-pipe-and-cancel "grep -oE '(https?://|git@|git://|ssh://|ftp://|file:///)[[:alnum:]?=%/_.:,;~@!#$&()*+-]*' | sed -E 's/[.,;:!?)]+$//' | head -n1 | xargs -r xdg-open >/dev/null 2>&1"
  }
}
