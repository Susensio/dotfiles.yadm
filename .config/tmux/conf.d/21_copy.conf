set -g mode-keys vi

%hidden HL_TIMEOUT=0.1

# Disabled: copy-pipe can conflict with this
set -s set-clipboard off

# ── PROFILE (vim vs helix) ─────────────────────────────
# Picks vim or helix motions -- everything after it is shared by both.
# rationale: docs/adr/0014-keep-both-vim-and-helix-copy-mode-grammars.md
set -g @copy_profile helix

# SELECT MODE -- helix only; vim's branch below never reads @copy_select.
# Reset on every fresh entry into copy-mode, since `y`/mouse-drag-end exit
# copy-mode via copy-pipe-and-cancel without ever reaching Escape below.
# rationale: docs/adr/0014-keep-both-vim-and-helix-copy-mode-grammars.md
set-hook -g pane-mode-changed 'if -F "#{==:#{pane_mode},copy-mode}" { set -p @copy_select 0 }'

# Shared; the @copy_select reset at the end only matters under helix.
bind -T copy-mode-vi Escape {
  if -F "#{selection_present}" {
    send -X clear-selection
  } {
    send -X cancel
  }
  set -p @copy_select 0
}

if -F "#{==:#{@copy_profile},helix}" {
  # Helix keybinds
  bind -T copy-mode-vi v {
    if -F "#{@copy_select}" {
      set -p @copy_select 0
    } {
      set -p @copy_select 1
      if -F "#{!:#{selection_present}}" { send -X begin-selection }
    }
  }
  bind -T copy-mode-vi w {
    if -F "#{!:#{@copy_select}}" { send -X clear-selection ; send -X begin-selection }
    send -X next-word
  }
  bind -T copy-mode-vi b {
    if -F "#{!:#{@copy_select}}" { send -X clear-selection ; send -X begin-selection }
    send -X previous-word
  }
  bind -T copy-mode-vi e {
    if -F "#{!:#{@copy_select}}" { send -X clear-selection ; send -X begin-selection }
    send -X next-word-end
  }
  # cursor-down (not select-line again) extends an existing linewise
  # selection, so repeats accumulate instead of restarting from scratch.
  bind -T copy-mode-vi x {
    if -F "#{&&:#{selection_present},#{==:#{selection_mode},line}}" { send -X cursor-down } { send -X select-line }
  }
  bind -T copy-mode-vi y {
    if -F "#{selection_active}" \
      { send-keys -X copy-pipe-and-cancel } \
      { send-keys -X begin-selection ; run-shell -d $HL_TIMEOUT ; send-keys -X copy-pipe-and-cancel }
  }
  unbind -T copy-mode-vi 'C-v'

  # Text objects via m (match), not bare i/a -- matches real Helix's mi/ma.
  unbind -T copy-mode-vi i
  unbind -T copy-mode-vi a
  bind -T copy-mode-vi m {
    if -F "#{selection_active}" { switch-client -T match }
  }
  bind -T match i switch-client -T extend-inner
  bind -T match a switch-client -T extend-around
} {
  # Vim keybinds
  bind -T copy-mode-vi v send -X begin-selection
  bind -T copy-mode-vi w send -X next-word
  bind -T copy-mode-vi b send -X previous-word
  bind -T copy-mode-vi e send -X next-word-end
  unbind -T copy-mode-vi x

  bind -T copy-mode-vi y {
    if -F "#{selection_active}" \
      { send-keys -X copy-pipe-and-cancel } \
      { switch-client -T yank }
  }

  bind -T yank y {
    send-keys -X select-line;
    run-shell -d $HL_TIMEOUT;
    send-keys -X copy-pipe-and-cancel;
  }
  bind -T yank w {
    send-keys -X begin-selection;
    send-keys -X next-word;
    run-shell -d $HL_TIMEOUT;
    send-keys -X copy-pipe-and-cancel;
  }
  bind -T yank W {
    send-keys -X begin-selection;
    send-keys -X next-space;
    run-shell -d $HL_TIMEOUT;
    send-keys -X copy-pipe-and-cancel;
  }
  bind-key -T yank F {
    send-keys -X begin-selection;
    command-prompt -1 -p "(jump backward)" { send-keys -X jump-backward "%%" };
    run-shell -d $HL_TIMEOUT;
    send-keys -X copy-pipe-and-cancel;
  }
  bind-key -T yank T {
    send-keys -X begin-selection;
    command-prompt -1 -p "(jump to backward)" { send-keys -X jump-to-backward "%%" };
    run-shell -d $HL_TIMEOUT;
    send-keys -X copy-pipe-and-cancel;
  }
  bind-key -T yank f {
    send-keys -X begin-selection;
    command-prompt -1 -p "(jump forward)" { send-keys -X jump-forward "%%" };
    run-shell -d $HL_TIMEOUT;
    send-keys -X copy-pipe-and-cancel;
  }
  bind-key -T yank t {
    send-keys -X begin-selection;
    command-prompt -1 -p "(jump to forward)" { send-keys -X jump-to-forward "%%" };
    run-shell -d $HL_TIMEOUT;
    send-keys -X copy-pipe-and-cancel;
  }

  bind -T yank i {
    switch-client -T yank-inner
  }
  bind -T yank a {
    switch-client -T yank-around
  }
  bind -T yank-inner w {
    send-keys -X previous-word;
    send-keys -X begin-selection;
    send-keys -X next-word-end;
    run-shell -d $HL_TIMEOUT;
    send-keys -X copy-pipe-and-cancel;
  }
  bind -T yank-inner W {
    send-keys -X previous-space;
    send-keys -X begin-selection;
    send-keys -X next-space-end;
    run-shell -d $HL_TIMEOUT;
    send-keys -X copy-pipe-and-cancel;
  }
  bind -T yank-inner p {
    send-keys -X previous-prompt;
    send-keys -X next-prompt -o;
    send-keys -X begin-selection;
    send-keys -X next-prompt;
    run-shell -d $HL_TIMEOUT;
    send-keys -X copy-pipe-and-cancel;
  }
  bind -T yank-around p {
    send-keys -X previous-prompt;
    send-keys -X begin-selection;
    send-keys -X next-prompt;
    run-shell -d $HL_TIMEOUT;
    send-keys -X copy-pipe-and-cancel;
  }

  # Block selection -- vim's Visual Block; helix has no equivalent
  bind-key -T copy-mode-vi 'C-v' {
    send -X begin-selection;
    send -X rectangle-toggle;
  }

  # Text objects via bare i/a, matching real vim's viw/vap.
  unbind -T copy-mode-vi m
  bind -T copy-mode-vi i {
    if -F "#{selection_active}" {
      switch-client -T extend-inner;
    }
  }
  bind -T copy-mode-vi a {
    if -F "#{selection_active}" {
      switch-client -T extend-around;
    }
  }
}

# ── TEXT OBJECTS (shared) ──────────────────────────────
# extend-inner/extend-around themselves are shared; only their entry point
# differs -- vim reaches them via bare i/a, helix via m (see PROFILE above).
bind -T extend-inner w {
  send-keys -X previous-word;
  send-keys -X begin-selection;
  send-keys -X next-word-end;
}
bind -T extend-inner W {
  send-keys -X previous-space;
  send-keys -X begin-selection;
  send-keys -X next-space-end;
}
bind -T extend-inner p {
  send-keys -X previous-prompt;
  send-keys -X next-prompt -o;
  send-keys -X begin-selection;
  send-keys -X next-prompt;
}
bind -T extend-around p {
  send-keys -X previous-prompt;
  send-keys -X begin-selection;
  send-keys -X next-prompt;
}

# ── COPY / PASTE (shared) ──────────────────────────────
set -s copy-command 'clipboard copy --selection clipboard'
# Mouse-based copies use the primary selection instead -- see 22_mouse.conf

bind -T copy-mode-vi Y {
  send-keys -X begin-selection;
  send-keys -X end-of-line;
  run-shell -d $HL_TIMEOUT;
  send-keys -X copy-pipe-and-cancel;
}

bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel

# Paste
bind -N "Paste clipboard" P run "tmux set-buffer -b clipboard_selection \"$(clipboard paste --selection clipboard)\"; \
            tmux paste-buffer -b clipboard_selection; \
            tmux delete-buffer -b clipboard_selection"

# ── SEARCH & PROMPT NAVIGATION ─────────────────────────
set -g wrap-search on
# Incremental search
bind -T copy-mode-vi / command-prompt -i -p "(search down)" { send -X search-forward-incremental "%%%" }
bind -T copy-mode-vi ? command-prompt -i -p "(search up)" { send -X search-backward-incremental "%%%" }
# Shortcut (changed direction because muscle memory and less keystrokes)
bind -N "Search" / copy-mode \; send ?

# Navigate between prompts
bind -T copy-mode-vi "[" send -X previous-prompt -o
bind -T copy-mode-vi "]" send -X next-prompt

# ── URL HANDLING ────────────────────────────────────────
%hidden URL_REGEX="(https?://|git@|git://|ssh://|ftp://|file:///)[[:alnum:]?=%/_.:,;~@!#$&()*+-]*"

# U searches backward for the nearest plain-text URL above the cursor (most
# URLs you want are already in scrollback); n/N (stock search-again/-reverse)
# keep cycling since they reuse whatever pattern the last search used.
bind -T copy-mode-vi U send -X search-backward -- "$URL_REGEX"

# Prefers a real OSC 8 hyperlink (for "click here"-style text); otherwise
# extracts the URL from the token under the cursor, stripping trailing
# punctuation like a wrapping ")" or ",".
bind -T copy-mode-vi O {
  if -F "#{copy_cursor_hyperlink}" {
    run-shell -b "xdg-open #{q:copy_cursor_hyperlink} >/dev/null 2>&1"
    send -X cancel
  } {
    send -X next-space-end
    send -X previous-space
    send -X begin-selection
    send -X next-space-end
    send -X copy-pipe-and-cancel "grep -oE '$URL_REGEX' | sed -E 's/[.,;:)]+\$//' | head -n1 | xargs -r xdg-open >/dev/null 2>&1"
  }
}
