# ==============================================================================
# 21_copy.conf - tmux-native copy-mode configuration
# ==============================================================================

set -g mode-keys vi

# Disabled: copy-pipe can conflict with this
set -s set-clipboard off

# ── SELECTION ─────────────────────────────────────────────────────────────────
# Native tmux motions own cursor and selection state.
bind -T copy-mode-vi Escape { if -F "#{selection_active}" { send-keys -X clear-selection } { send-keys -X cancel } }
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi ';' send-keys -X clear-selection
bind -T copy-mode-vi '%' { send-keys -X clear-selection ; send-keys -X history-top ; send-keys -X begin-selection ; send-keys -X history-bottom ; send-keys -X end-of-line }

# x selects/accumulates lines; C starts a rectangle selection.
bind -T copy-mode-vi x { if -F "#{==:#{selection_mode},line}" { send-keys -X cursor-down } { send-keys -X select-line } }
bind -T copy-mode-vi C { send-keys -X clear-selection ; send-keys -X begin-selection ; send-keys -X rectangle-on }

# y copies the selection or the cursor cell; Y copies the current line.
bind -T copy-mode-vi y { if -F "#{selection_active}" { send-keys -X copy-pipe-and-cancel } { send-keys -X begin-selection ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel } }
bind -T copy-mode-vi Y { send-keys -X select-line ; run-shell -d 0.1 ; send-keys -X copy-pipe-and-cancel }

# Text objects: mi<obj>, ma<obj>; mm/% jump to a matching bracket.
unbind -T copy-mode-vi i
unbind -T copy-mode-vi a
bind -T copy-mode-vi m switch-client -T match
bind -T match i switch-client -T extend-inner
bind -T match a switch-client -T extend-around
bind -T match m send-keys -X next-matching-bracket
bind -T match % send-keys -X next-matching-bracket

# ── TEXT OBJECTS ──────────────────────────────────────────────────────────────
# Word / WORD text objects
bind -T extend-inner w  { send-keys -X select-word }
bind -T extend-inner W  { send-keys -X clear-selection ; send-keys -X next-space-end ; send-keys -X previous-space ; send-keys -X begin-selection ; send-keys -X next-space-end }
bind -T extend-around w { send-keys -X clear-selection ; send-keys -X next-word-end ; send-keys -X previous-word ; send-keys -X begin-selection ; send-keys -X next-word }
bind -T extend-around W { send-keys -X clear-selection ; send-keys -X previous-space ; send-keys -X begin-selection ; send-keys -X next-space }

# Prompt text objects (mip = command output, map = prompt + output)
bind -T extend-inner p  { send-keys -X clear-selection ; send-keys -X previous-prompt ; send-keys -X next-prompt -o ; send-keys -X begin-selection ; send-keys -X next-prompt ; send-keys -X cursor-left }
bind -T extend-around p { send-keys -X clear-selection ; send-keys -X previous-prompt ; send-keys -X begin-selection ; send-keys -X next-prompt ; send-keys -X cursor-left }

# Brackets: () / [] / {} / <>
bind -T extend-inner '(' { send-keys -X clear-selection ; send-keys -X jump-backward '(' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward ')' }
bind -T extend-inner ')' { send-keys -X clear-selection ; send-keys -X jump-backward '(' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward ')' }
bind -T extend-inner b   { send-keys -X clear-selection ; send-keys -X jump-backward '(' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward ')' }
bind -T extend-around '(' { send-keys -X clear-selection ; send-keys -X jump-backward '(' ; send-keys -X begin-selection ; send-keys -X jump-forward ')' }
bind -T extend-around ')' { send-keys -X clear-selection ; send-keys -X jump-backward '(' ; send-keys -X begin-selection ; send-keys -X jump-forward ')' }
bind -T extend-around b   { send-keys -X clear-selection ; send-keys -X jump-backward '(' ; send-keys -X begin-selection ; send-keys -X jump-forward ')' }

bind -T extend-inner '[' { send-keys -X clear-selection ; send-keys -X jump-backward '[' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward ']' }
bind -T extend-inner ']' { send-keys -X clear-selection ; send-keys -X jump-backward '[' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward ']' }
bind -T extend-around '[' { send-keys -X clear-selection ; send-keys -X jump-backward '[' ; send-keys -X begin-selection ; send-keys -X jump-forward ']' }
bind -T extend-around ']' { send-keys -X clear-selection ; send-keys -X jump-backward '[' ; send-keys -X begin-selection ; send-keys -X jump-forward ']' }

bind -T extend-inner '{' { send-keys -X clear-selection ; send-keys -X jump-backward '{' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward '}' }
bind -T extend-inner '}' { send-keys -X clear-selection ; send-keys -X jump-backward '{' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward '}' }
bind -T extend-inner B   { send-keys -X clear-selection ; send-keys -X jump-backward '{' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward '}' }
bind -T extend-around '{' { send-keys -X clear-selection ; send-keys -X jump-backward '{' ; send-keys -X begin-selection ; send-keys -X jump-forward '}' }
bind -T extend-around '}' { send-keys -X clear-selection ; send-keys -X jump-backward '{' ; send-keys -X begin-selection ; send-keys -X jump-forward '}' }
bind -T extend-around B   { send-keys -X clear-selection ; send-keys -X jump-backward '{' ; send-keys -X begin-selection ; send-keys -X jump-forward '}' }

bind -T extend-inner '<' { send-keys -X clear-selection ; send-keys -X jump-backward '<' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward '>' }
bind -T extend-inner '>' { send-keys -X clear-selection ; send-keys -X jump-backward '<' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward '>' }
bind -T extend-around '<' { send-keys -X clear-selection ; send-keys -X jump-backward '<' ; send-keys -X begin-selection ; send-keys -X jump-forward '>' }
bind -T extend-around '>' { send-keys -X clear-selection ; send-keys -X jump-backward '<' ; send-keys -X begin-selection ; send-keys -X jump-forward '>' }

# Quotes: "" / '' / ``
bind -T extend-inner '"' { send-keys -X clear-selection ; send-keys -X jump-backward '"' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward '"' }
bind -T extend-around '"' { send-keys -X clear-selection ; send-keys -X jump-backward '"' ; send-keys -X begin-selection ; send-keys -X jump-forward '"' }
bind -T extend-inner "'" { send-keys -X clear-selection ; send-keys -X jump-backward "'" ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward "'" }
bind -T extend-around "'" { send-keys -X clear-selection ; send-keys -X jump-backward "'" ; send-keys -X begin-selection ; send-keys -X jump-forward "'" }
bind -T extend-inner '`' { send-keys -X clear-selection ; send-keys -X jump-backward '`' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward '`' }
bind -T extend-around '`' { send-keys -X clear-selection ; send-keys -X jump-backward '`' ; send-keys -X begin-selection ; send-keys -X jump-forward '`' }
bind -T extend-inner q   { send-keys -X clear-selection ; send-keys -X jump-backward '"' ; send-keys -X cursor-right ; send-keys -X begin-selection ; send-keys -X jump-to-forward '"' }
bind -T extend-around q  { send-keys -X clear-selection ; send-keys -X jump-backward '"' ; send-keys -X begin-selection ; send-keys -X jump-forward '"' }

# ── PROMPT NAVIGATION (shared) ────────────────────────────────────────────────
bind -T copy-mode-vi "[" send-keys -X previous-prompt
bind -T copy-mode-vi "]" send-keys -X next-prompt
bind -T copy-mode-vi "{" send-keys -X previous-prompt -o
bind -T copy-mode-vi "}" send-keys -X next-prompt -o

# ── COPY / PASTE (shared) ─────────────────────────────────────────────────────
set -s copy-command 'clipboard copy --selection clipboard'
# Mouse-based copies use the primary selection instead -- see 22_mouse.conf

bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel

# Paste clipboard cleanly via pipe to avoid shell escaping issues
bind -N "Paste clipboard" P run-shell "clipboard paste --selection clipboard | tmux load-buffer -b clipboard_selection - && tmux paste-buffer -d -b clipboard_selection"

# ── SEARCH ────────────────────────────────────────────────────────────────────
set -g wrap-search on
# Incremental search
bind -T copy-mode-vi / command-prompt -i -p "(search down)" { send-keys -X search-forward-incremental "%%%" }
bind -T copy-mode-vi ? command-prompt -i -p "(search up)" { send-keys -X search-backward-incremental "%%%" }
# Shortcut (search backward into scrollback)
bind -N "Search" / copy-mode \; send-keys ?

# ── URL HANDLING ──────────────────────────────────────────────────────────────
# U searches backward for the nearest plain-text URL above cursor
bind -T copy-mode-vi U send-keys -X search-backward -- "(https?://|git@|git://|ssh://|ftp://|file:///)[[:alnum:]?=%/_.:,;~@!#$&()*+-]*"

# Open URL under cursor (prefers OSC 8 hyperlinks, falls back to regex extract)
bind -T copy-mode-vi O {
  if -F "#{copy_cursor_hyperlink}" {
    run-shell -b "xdg-open #{q:copy_cursor_hyperlink} >/dev/null 2>&1"
    send-keys -X cancel
  } {
    send-keys -X next-space-end
    send-keys -X previous-space
    send-keys -X begin-selection
    send-keys -X next-space-end
    send-keys -X copy-pipe-and-cancel "grep -oE '(https?://|git@|git://|ssh://|ftp://|file:///)[[:alnum:]?=%/_.:,;~@!#$&()*+-]*' | sed -E 's/[.,;:!?)]+$//' | head -n1 | xargs -r xdg-open >/dev/null 2>&1"
  }
}
