# Mouse mode
set -g mouse on

# DEFAULT mouse keybinds
bind-key -n MouseDown1Pane            select-pane -t = \; send-keys -M
bind-key -n MouseDown2Pane            select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { run "tmux set-buffer -b primary_selection \"$(clipboard paste --selection primary)\"; tmux paste-buffer -b primary_selection; tmux delete-buffer -b primary_selection" }
bind-key -n MouseDrag1Pane            if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -M }
bind-key -n MouseDrag1Border          resize-pane -M

bind-key -n MouseDown1Status          switch-client -t =
# tmux ships no default right-click context menu here; these two build it
# from scratch.
# rationale: docs/adr/0018-fork-tmux-default-mouse-bindings-into-conf-d.md
bind-key -n MouseUp3Status            display-menu -O -T "#[align=centre]#{window_index}:#{window_name}" -t = -x W -y W "#{?#{>:#{session_windows},1},,-}Swap Left" h { swap-window -t :-1 } "#{?#{>:#{session_windows},1},,-}Swap Right" l { swap-window -t :+1 } "#{?pane_marked_set,,-}Swap Marked" s { swap-window } '' Kill X { kill-window } Respawn R { respawn-window -k } "#{?pane_marked,Unmark,Mark}" m { select-pane -m } Rename r { command-prompt -F -I "#W" { rename-window -t "#{window_id}" "%%" } } '' "New After" w { new-window -a } "New At End" W { new-window }
# Sessionizer replaces Next/Previous: it both switches to a live session and
# opens a directory as a new one. On f, as in the prefix table. Quoted, not
# braced -- a command-alias is not registered yet when this file is parsed.
bind-key -n MouseUp3StatusLeft        display-menu -O -T "#[align=centre]#{session_name}" -t = -x M -y W \
  "Switch..."    f "sessionizer" \
  '' \
  Rename         r { command-prompt -I "#S" { rename-session "%%" } } \
  Renumber       N { move-window -r } \
  '' \
  "New Session"  s { new-session -c "$HOME" } \
  "New Window"   w { new-window } \
  Detach         d { detach-client } \
  '' \
  "Kill session" X { confirm-before -p "Kill session #S? (y/n)" kill-session }
bind-key -n WheelUpStatus             previous-window
bind-key -n WheelDownStatus           next-window

# Copy
# alternate_on keeps the wheel passing through to fullscreen apps (less, vim);
# without it they would be hijacked into copy-mode.
bind-key -n WheelUpPane               if-shell -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -e ; send -X -N 5 scroll-up }
# Copy hyperlink on H, not h: stock tmux gives it the same key as Horizontal
# Split, which then cannot be reached while a hyperlink is under the cursor.
bind-key -n MouseUp3Pane              if-shell -F -t = "#{||:#{mouse_any_flag},#{&&:#{pane_in_mode},#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}}}" { select-pane -t = ; send-keys -M } { display-menu -O -T "#[align=centre]#{pane_index} (#{pane_id})" -t = -x M -y M "#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Top,}" < { send-keys -X history-top } "#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Bottom,}" > { send-keys -X history-bottom } '' "#{?mouse_word,Search For #[underscore]#{=/9/...:mouse_word},}" C-r { if-shell -F "#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}" "copy-mode -t=" ; send-keys -X -t = search-backward -- "#{q:mouse_word}" } "#{?mouse_word,Type #[underscore]#{=/9/...:mouse_word},}" C-y { copy-mode -q ; send-keys -l "#{q:mouse_word}" } "#{?mouse_word,Copy #[underscore]#{=/9/...:mouse_word},}" c { copy-mode -q ; set-buffer "#{q:mouse_word}" } "#{?mouse_line,Copy Line,}" l { copy-mode -q ; set-buffer "#{q:mouse_line}" } '' "#{?mouse_hyperlink,Type #[underscore]#{=/9/...:mouse_hyperlink},}" C-h { copy-mode -q ; send-keys -l "#{q:mouse_hyperlink}" } "#{?mouse_hyperlink,Copy #[underscore]#{=/9/...:mouse_hyperlink},}" H { copy-mode -q ; set-buffer "#{q:mouse_hyperlink}" } '' "Horizontal Split" h { split-window -h } "Vertical Split" v { split-window -v } '' "#{?#{>:#{window_panes},1},,-}Swap Up" u { swap-pane -U } "#{?#{>:#{window_panes},1},,-}Swap Down" d { swap-pane -D } "#{?pane_marked_set,,-}Swap Marked" s { swap-pane } '' Kill X { kill-pane } Respawn R { respawn-pane -k } "#{?pane_marked,Unmark,Mark}" m { select-pane -m } "#{?#{>:#{window_panes},1},,-}#{?window_zoomed_flag,Unzoom,Zoom}" z { resize-pane -Z } }
bind-key -n DoubleClick1Pane          select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel }
bind-key -n TripleClick1Pane          select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-line ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel }

# ── COPY MODE ───────────────────────────────────────────
# Every mouse binding lives in this file, so a root-table one cannot be
# shadowed by a later-sourced file. $HL_TIMEOUT comes from 21_copy.conf.
bind-key -T copy-mode-vi MouseDown1Pane {
  select-pane;
  send -X clear-selection;
}

bind-key -T copy-mode-vi MouseDragEnd1Pane { send -X copy-pipe-no-clear 'clipboard copy --selection primary' }
bind-key -T copy-mode-vi DoubleClick1Pane {
  select-pane;
  send-keys -X select-word;
  run-shell -d $HL_TIMEOUT;
  send-keys -X copy-pipe-and-cancel 'clipboard copy --selection primary';
}
bind-key -T copy-mode-vi TripleClick1Pane {
  select-pane;
  send-keys -X select-line;
  run-shell -d $HL_TIMEOUT;
  send-keys -X copy-pipe-and-cancel 'clipboard copy --selection primary';
}

# Scroll while selecting clears the selection first
bind-key -T copy-mode-vi WheelUpPane {
  select-pane;
  send -X clear-selection;
  send -X -N 5 scroll-up;
}

bind-key -T copy-mode-vi WheelDownPane {
  select-pane;
  send -X clear-selection;
  send -X -N 5 scroll-down;
}

bind-key -n MouseDown1ScrollbarUp     copy-mode -u
bind-key -n MouseDown1ScrollbarDown   copy-mode -d
bind-key -n MouseDrag1ScrollbarSlider copy-mode -S

# Clickable [z]/[x] buttons shown in pane-border-format (top-right of each border)
bind-key -n MouseDown1Control8        resize-pane -Z -t =
bind-key -n MouseDown1Control9        kill-pane -t =

# BELL_TRAY icon (31_visual.conf) -> popup menu of windows with a bell.
# Bound on release (MouseUp), not press: this menu opens via a detached
# background script rather than the binding itself, so tmux doesn't
# associate a MouseDown open with the same click's immediate MouseUp to
# race against.
# rationale: docs/adr/0018-fork-tmux-default-mouse-bindings-into-conf-d.md
bind-key -n MouseUp1Control7            run-shell -b "$TMUX_SCRIPTS_DIR/bell-menu"
