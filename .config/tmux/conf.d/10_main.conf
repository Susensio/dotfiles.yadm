# Bound in the root table instead (20_navigation.conf), so entering the prefix
# table can arm the which-key menu; tmux's own handling would run first.
set -g prefix None
bind -N "Send prefix" C-Space send-keys C-Space

set -g default-shell "/usr/bin/fish"

set -sa terminal-features "*:hyperlinks"

# Claude Code inside tmux: passthrough for notifications/progress bar,
# extended-keys so Shift+Enter isn't seen as plain Enter.
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features "xterm*:extkeys"

# Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -g escape-time 10
# Timeout between repeatable keys
set -g repeat-time 700

set -g history-limit 50000
# Useful with grouped sessions and multi-monitor setups.
set -g aggressive-resize on

set -g detach-on-destroy no-detached


# Auto-equalize keeps a window's panes balanced on split/close. A manual
# resize steps it back until only one pane is left.
set -gw @auto_equalize 1
set-hook -ga pane-exited { if -F "#{==:#{window_panes},1}" "set -w @auto_equalize 1"}

# select-layout -E fires after-resize-pane too; @equalizing tells that apart
# from a real manual resize below.
set -aF command-alias equalize-panes="set -w @equalizing 1 ; select-layout -E ; set -uw @equalizing"
set-hook -ga after-resize-pane 'if -F "#{!:#{@equalizing}}" "set -w @auto_equalize 0"'

set-hook -ga after-split-window 'if -F "#{@auto_equalize}" "equalize-panes"'
set-hook -ga pane-exited { if -F "#{&&:#{@auto_equalize},#{==:#{hook_window},#{window_id}}}" "equalize-panes" }
