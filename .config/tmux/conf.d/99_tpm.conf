# TPM XDG compliant (out of config dir)
set-environment -g -F TMUX_PLUGIN_MANAGER_PATH "#{?XDG_DATA_HOME,#{XDG_DATA_HOME},#{HOME}/.local/share}/tmux/plugins"

set -g @plugin 'tmux-plugins/tpm'

# Install `tpm` if needed.
if "test ! -d ${XDG_DATA_HOME}/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ${XDG_DATA_HOME}/tmux/plugins/tpm && ${XDG_DATA_HOME}/tmux/plugins/tpm/bin/install_plugins'"

# Keep this line at the very bottom of tmux.conf
run "${XDG_DATA_HOME}/tmux/plugins/tpm/tpm"

# tpm binds I / U / M-u in the prefix table; they live in the config table
# instead. Unbinding after its run line (must stay below it) is the only
# clean way to reclaim them.
# rationale: docs/adr/0016-adopt-tpm-reclaim-bindings.md
unbind -T prefix I
unbind -T prefix U
unbind -T prefix M-u

set -a command-alias install-plugins="run '${XDG_DATA_HOME}/tmux/plugins/tpm/bindings/install_plugins'"
set -a command-alias update-plugins="run '${XDG_DATA_HOME}/tmux/plugins/tpm/bindings/update_plugins'"
set -a command-alias clean-plugins="run '${XDG_DATA_HOME}/tmux/plugins/tpm/bindings/clean_plugins'"

bind -T config -N "Install plugins"   I    "install-plugins"
bind -T config -N "Update plugins"    U    "update-plugins"
bind -T config -N "Clean plugins"     M-u  "clean-plugins"
