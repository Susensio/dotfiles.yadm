# ── ROOT TABLE (no prefix) ──────────────────────────

# Pane navigation with boundary guards
bind -n M-h if -F "#{pane_at_left}" {} { select-pane -L }
bind -n M-j if -F "#{pane_at_bottom}" {} { select-pane -D }
bind -n M-k if -F "#{pane_at_top}" {} { select-pane -U }
bind -n M-l if -F "#{pane_at_right}" {} { select-pane -R }

# Window navigation with boundary guards
bind -n M-i if -F "#{!=:#{window_index},#{base-index}}" { previous-window }
bind -n M-o if -F "#{!=:#{window_index},#{last_window_index}}" { next-window }

# Direct window selection
bind -n M-0 select-window -t :=0
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

# Scratchpads
bind -n M-t "scratchpad"
bind -n M-m "man"


# ── PREFIX TABLE ────────────────────────────────────

# tmux does not enter the prefix table on its own -- `prefix` is None in
# 10_main.conf. This binding enters it and arms its menu like the tables
# below.
# rationale: docs/adr/0012-modal-tmux-key-tables.md
bind -n C-Space switch-client -T prefix \; which-key

# Key tables. Each arms a which-key menu: scripts/which-key lists the table
# once the client has idled in it. \; (not { }) for the alias -- see below.
bind -N "PANE..."      p     switch-client -T pane    \; which-key
bind -N "TAB..."       t     switch-client -T tab     \; which-key
bind -N "SESSION..."   s     switch-client -T session \; which-key
bind -N "CONFIG..."    c     switch-client -T config  \; which-key

bind -N "New pane"     Enter "new-split"
# Same letter as copy-mode-vi's select-mode toggle (21_copy.conf). Both mean
# "enter visual/select", just in different tables.
bind -N "Copy mode"    v     copy-mode -e
bind -N "Command"      :     command-prompt
bind -N "Sessionizer"  f     "sessionizer"
bind -N "Lazygit"      g     "lazygit"
bind -N "Manpages"     m     "man"
# Also at Prefix → c → r
bind -N "Reload config" r "reload-config"
bind -N "Notifications" n    run-shell -b "$TMUX_SCRIPTS_DIR/bell-menu"


# ── PANE TABLE (Prefix → p → ...) ──────────────────

bind -T pane -N "New pane"            n   "new-split"
bind -T pane -N "Kill pane"           x   confirm-before -p "Kill pane? (y/n)" kill-pane
bind -T pane -N "Toggle zoom"         z   resize-pane -Z
bind -T pane -N "Equalize"            =   "equalize-panes"

# Repeatable: hold to adjust. k is "Resize up" here, so kill lives on x
bind -T pane -N "Resize left"    -r   h   resize-pane -L 4
bind -T pane -N "Resize down"    -r   j   resize-pane -D 2
bind -T pane -N "Resize up"      -r   k   resize-pane -U 2
bind -T pane -N "Resize right"   -r   l   resize-pane -R 4

bind -T pane -N "Swap left"           H   swap-pane -d -s "." -t "{left-of}"
bind -T pane -N "Swap down"           J   swap-pane -d -s "." -t "{down-of}"
bind -T pane -N "Swap up"             K   swap-pane -d -s "." -t "{up-of}"
bind -T pane -N "Swap right"          L   swap-pane -d -s "." -t "{right-of}"

bind -T pane -N "Break"               !   break-pane
bind -T pane -N "Join to..."          @   choose-tree -w "join-pane -h -t '%%'"


# ── TAB TABLE (Prefix → t → ...) ───────────────────

bind -T tab -N "New tab"              n   new-window
bind -T tab -N "Kill tab"             x   confirm-before -p "Kill window #W? (y/n)" kill-window
bind -T tab -N "Rename tab"           r   command-prompt -I "" { rename-window "%%" }

bind -T tab -N "Swap left"       -r   H   { swap-window -d -t -1 }
bind -T tab -N "Swap right"      -r   L   { swap-window -d -t +1 }


# ── SESSION TABLE (Prefix → s → ...) ───────────────

bind -T session -N "New session"      n   new-session -c "$HOME"
bind -T session -N "Kill session"     x   confirm-before -p "Kill session #S? (y/n)" kill-session
bind -T session -N "Rename session"   r   command-prompt -I "#S" { rename-session "%%" }

bind -T session -N "Last session"     l   "last-session"
bind -T session -N "Choose session"   s   choose-tree -sZ

bind -T session -N "Detach"           d   detach

# ── CONFIG TABLE (Prefix → c → ...) ────────────────

# Reload prints output only on error. Also at Prefix → r
bind -T config -N "Reload config"     r   "reload-config"
bind -T config -N "Edit config"       e   new-window -n "config" "$EDITOR $TMUX_CONFIG_DIR"

# \; (not { }) required: conf.d/*.conf is glob-sourced, so { } here would
# be parsed before 15_aliases.conf's notify alias has registered ->
# "unknown command: notify". \; defers parsing to key-press time instead.
bind -T config -N "Toggle mouse"      m   set mouse \; notify "Mouse: #{?mouse,ON,OFF}"
bind -T config -N "Toggle sync"       s   set synchronize-panes \; notify "Sync: #{?synchronize-panes,ON,OFF}"
