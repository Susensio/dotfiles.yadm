# ROOT TABLE
bind -n M-h if -F "#{pane_at_left}" {} { select-pane -L }
bind -n M-j if -F "#{pane_at_bottom}" {} { select-pane -D }
bind -n M-k if -F "#{pane_at_top}" {} { select-pane -U }
bind -n M-l if -F "#{pane_at_right}" {} { select-pane -R }

bind -n M-i if -F "#{!=:#{window_index},1}" { previous-window }
bind -n M-o if -F "#{!=:#{window_index},#{last_window_index}}" { next-window }

bind -n M-0 select-window -t :=0
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9



# PREFIX TABLE
bind -N "New pane" Enter "new-split"
# bind -N "New tab" t new-window
bind -N "Copy mode" v copy-mode -e
bind -N "Command" : command-prompt

bind -N "PANE..." p switch-client -T pane
bind -N "TAB..." t switch-client -T tab
bind -N "SESSION..." s switch-client -T session
bind -N "CONFIG..." c switch-client -T config


# PANE TABLE
bind -T pane -N "New pane" n "new-split"


# TAB TABLE
bind -T tab -N "New tab" n new-window


# SESSION TABLE
bind -T session -N "New session" n new-session -c "$HOME"

bind -n M-t "scratchpad"
bind -n M-m "man"
bind f "sessionizer"
bind g "lazygit"

