[ids]

*
# Mice kept out of keyd's experimental mouse path.
# Get a device's id from `keyd monitor` or `journalctl -u keyd | grep match`.
# Logitech MX Master 3 (Unifying receiver)
-046d:4082

[global]

# A deliberate Control hold must not resolve as Escape on release.
overload_tap_timeout = 300

# Logitech firmware macros arrive ~22ms apart.
chord_timeout = 35

[main]

# Maps capslock to escape when pressed and control when held.
capslock = overload(caps, esc)

rightalt = oneshot(altgr)

# MX Keys lock key is firmware Super+L, 22ms apart; the chord window catches it before Hyprland's Super+L focus bind.
leftmeta+l = coffee

# Dell F8 display key is firmware Super+P; Hyprland binds the video-mode key (xkb code:235).
leftmeta+p = switchvideomode

[shift]
# Pressing both Shift keys toggles Caps Lock.
leftshift = capslock
rightshift = capslock

[caps:C]
# Capslock-held behaves as Control (:C) except for space, used as tmux prefix
space = f12
