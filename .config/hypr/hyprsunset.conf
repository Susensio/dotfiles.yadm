# Night light schedule; hypr/autostart.lua starts hyprsunset with the session.
# Apply an edit with `omarchy restart hyprsunset`.

# Daytime: leave the screen untouched. Without an identity profile hyprsunset
# applies its default tint.
profile {
    time = 07:00
    identity = true
}

profile {
    time = 20:00
    temperature = 4000
}
