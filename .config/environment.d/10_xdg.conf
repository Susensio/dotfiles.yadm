# XDG basedir spec paths
XDG_CONFIG_HOME=$HOME/.config
XDG_CACHE_HOME=$HOME/.cache
XDG_DATA_HOME=$HOME/.local/share
XDG_STATE_HOME=$HOME/.local/state
XDG_BIN_HOME=$HOME/.local/bin
XDG_LIB_HOME=$HOME/.local/lib

# Rust
CARGO_HOME=$XDG_DATA_HOME/cargo
RUSTUP_HOME=$XDG_DATA_HOME/rustup

# Node
NPM_CONFIG_USERCONFIG=$XDG_CONFIG_HOME/npm/npmrc
NPM_CONFIG_PREFIX=$XDG_DATA_HOME/npm
NPM_CONFIG_CACHE=$XDG_CACHE_HOME/npm
NPM_CONFIG_INIT_MODULE=$XDG_CONFIG_HOME/npm/config/npm-init.js
NPM_CONFIG_LOGS_DIR=$XDG_STATE_HOME/npm/logs

# Python
# BUG: python/startup.py was deleted, so interactive python3 opens with
# "Could not open PYTHONSTARTUP" and a FileNotFoundError.
PYTHONSTARTUP=$XDG_CONFIG_HOME/python/startup.py
IPYTHONDIR=$XDG_CONFIG_HOME/ipython
JUPYTER_CONFIG_DIR=$XDG_CONFIG_HOME/jupyter


ERRFILE=$XDG_CACHE_HOME/X11/xsession-errors
LESSHISTFILE=$XDG_STATE_HOME/lesshst
GNUPGHOME=$XDG_DATA_HOME/gnupg
GTK2_RC_FILES=$XDG_CONFIG_HOME/gtk-2.0/gtkrc
