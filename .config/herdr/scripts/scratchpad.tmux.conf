# Herdr popup uses tmux only to persist a shell between opens.
set -g status off
set -g prefix None
unbind -a -T prefix
unbind -a -T root
set -g detach-on-destroy on
set -g remain-on-exit off
set -g default-shell "/usr/bin/fish"
set -g escape-time 10
set -g history-limit 50000
set -g mouse on

# The popup owns input while open; detach to close it and keep the shell.
bind -n M-\` detach-client
