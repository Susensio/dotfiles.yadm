# herdr scratchpad tmux shim, loaded ONLY by the shared herdr scratchpad
# server (`tmux -L herdr_scratchpad -f` in the sibling `scratchpad` script).
# The socket name ends in `_scratchpad`, so the tmux-native guard in
# 50_scratchpad.conf recognizes this server and supplies the scratchpad
# semantics (chrome off, detach-on-destroy, window-unlinked detach) from a
# single source of truth. This shim deliberately does NOT load the main
# tmux.conf: no TPM boot, no plugins, no sessionizer/bell-menu key surface.

# The native scratchpad branch: status off, borders off, detach handling,
# and the prefix-S delegation (which we override below - the "parent" here
# is herdr, not a tmux socket).
source /home/susensio/.config/tmux/conf.d/50_scratchpad.conf

# Popup-only ergonomics the main config would otherwise supply.
# Pin fish: the main config does too (10_main.conf), and a herdr popup's
# env carries no $SHELL, so tmux would otherwise fall back to /bin/bash.
set -g default-shell "/usr/bin/fish"
set -g escape-time 10
set -g history-limit 50000
set -g mouse on

# Toggle. Herdr popups are modal and eat all terminal input, so the
# herdr-level alt+` binding that opens the popup never fires while it is
# up (tmux popups have the same constraint; the native scratchpad handles
# it via bind -n M-` in 20_keybinds.conf, which this shim does not load).
# Mirror that one binding: detach the client, the script's process exits,
# herdr closes the popup, the next press re-attaches to the same session.
bind -n M-\` detach-client

# The sourced 50_scratchpad.conf binds prefix-S to "detach + switch to the
# parent tmux socket" - a parent that does not exist under herdr. Rebind S
# to plain detach: the leave-the-popup semantic without the missing socket.
bind -T prefix S detach-client
