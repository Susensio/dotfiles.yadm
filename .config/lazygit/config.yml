os:
  # omarchy-editor-sync keeps this on Omarchy's editor pick; lazygit cannot
  # read it through $EDITOR (https://github.com/omacom/omarchy/pull/7821)
  editPreset: helix
gui:
  scrollHeight: 10
promptToReturnFromSubprocess: false
customCommands:
  - key: <ctrl-a>
    context: files
    description: Fill commit message with AI
    command: git aicommit --lazygit
    output: logWithPty
    loadingText: Generating AI commit message...
