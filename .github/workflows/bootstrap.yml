name: Bootstrap

on:
  - push
  - pull_request
  - workflow_dispatch

# A pull request runs on its merge ref; clone the branch itself
# An explicit bash adds pipefail, so a test's failure survives its sed
defaults:
  run:
    shell: bash

env:
  BRANCH: ${{ github.head_ref || github.ref_name }}
  # mise looks up releases on GitHub, whose anonymous limit runners share
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  ubuntu:
    # Linux Mint 22's base; ubuntu-latest moves on without it
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # No login in CI: lingering starts the user manager `systemctl --user` needs
      - name: Start a user session
        run: |
          sudo modprobe uinput
          sudo loginctl enable-linger "$USER"
          uid=$(id -u)
          for _ in $(seq 30); do [ -S "/run/user/$uid/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
          # Stock Ubuntu's mode, which 10_xdg_compliance/sudo.sh relies on
          sudo chmod 755 /etc/sudoers.d

      # The README's command, on the branch under test
      - name: Clone and bootstrap
        run: |
          export NEW_MACHINE_BRANCH=$BRANCH
          export NEW_MACHINE_REPO_URL="https://github.com/$GITHUB_REPOSITORY.git"
          export NEW_MACHINE_RAW_URL="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$BRANCH"
          # shellcheck disable=SC1090
          source <(curl -fsSL "$NEW_MACHINE_RAW_URL/.config/yadm/new-machine")

      # As the bootstrap asks once environment.d changed: restart the user manager
      - name: Log in again
        run: |
          sudo systemctl restart "user@$(id -u)"
          for _ in $(seq 30); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 1; done

      # A login shell, whose profile imports the user manager's environment
      - name: Test
        run: |
          # FAIL lines become annotations on the run's summary page
          bash --login -c 'cd && just --justfile .config/justfile bootstrap-test' | sed 's/^FAIL /::error::&/'

      # Steps print only what they change
      - name: Bootstrap again, silently
        if: ${{ !cancelled() }}
        run: |
          out=$(~/.config/yadm/bootstrap 2>&1 || echo "failed: exit $?")
          [ -z "$out" ] && exit 0
          echo "::error title=Second bootstrap is not silent::${out//$'\n'/%0A}"
          exit 1

  # Debian 13 from its bare image: no sudo, curl, git or user, so the prerequisites are
  # installed as on a fresh machine. A container runs no systemd: the steps that
  # need it (keyd's service, user services) skip themselves, the rest runs as usual.
  debian:
    runs-on: ubuntu-latest
    container: debian:13
    timeout-minutes: 20
    steps:
      # What a Debian install gives a user who can sudo, and the one tool the README needs
      - name: Prepare a user
        run: |
          apt-get update -qq
          apt-get install -y -qq sudo wget ca-certificates
          useradd --create-home --shell /bin/bash dev
          echo "dev ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/dev
          # A login shell as dev, as a terminal has; the command is a string, or a script on stdin
          cat > /usr/local/bin/as-dev <<'EOF'
          #!/bin/sh
          exec su --login dev --whitelist-environment=BRANCH,GITHUB_REPOSITORY,GITHUB_TOKEN,NEW_MACHINE_BRANCH,NEW_MACHINE_REPO_URL,NEW_MACHINE_RAW_URL -c "$1"
          EOF
          chmod +x /usr/local/bin/as-dev

      # The README's command, on the branch under test; the image has no curl, so wget fetches it
      - name: Clone and bootstrap
        run: |
          as-dev 'bash -euo pipefail -s' <<'EOF'
          export NEW_MACHINE_BRANCH=$BRANCH
          export NEW_MACHINE_REPO_URL="https://github.com/$GITHUB_REPOSITORY.git"
          export NEW_MACHINE_RAW_URL="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$BRANCH"
          source <(wget -qO- "$NEW_MACHINE_RAW_URL/.config/yadm/new-machine")
          EOF

      # No user manager to import environment.d from, so the login's PATH is applied by hand
      - name: Test
        run: |
          as-dev 'set -a; . .config/environment.d/10_xdg.conf; . .config/environment.d/11_path.conf; set +a
            just --justfile .config/justfile bootstrap-test' | sed 's/^FAIL /::error::&/'

      - name: Bootstrap again, silently
        if: ${{ !cancelled() }}
        run: |
          out=$(as-dev .config/yadm/bootstrap 2>&1 || echo "failed: exit $?")
          [ -z "$out" ] && exit 0
          echo "::error title=Second bootstrap is not silent::${out//$'\n'/%0A}"
          exit 1

  # Omarchy's ISO, replayed in an Arch container booted into systemd (actions/omarchy)
  omarchy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/omarchy

      - name: Clone and bootstrap
        run: |
          # shellcheck disable=SC2016  # $0 and $1 expand in the container
          as-dev -euo pipefail -c '
            export NEW_MACHINE_BRANCH=$0
            export NEW_MACHINE_REPO_URL="https://github.com/$1.git"
            export NEW_MACHINE_RAW_URL="https://raw.githubusercontent.com/$1/$0"
            source <(curl -fsSL "$NEW_MACHINE_RAW_URL/.config/yadm/new-machine")
          ' "$BRANCH" "$GITHUB_REPOSITORY"

      - name: Log in again
        run: |
          docker exec omarchy systemctl restart user@1000
          docker exec omarchy bash -c 'for _ in $(seq 30); do [ -S /run/user/1000/bus ] && break; sleep 1; done'

      - name: Test
        run: as-dev -c 'just --justfile .config/justfile bootstrap-test' | sed 's/^FAIL /::error::&/'

      - name: Bootstrap again, silently
        if: ${{ !cancelled() }}
        run: |
          out=$(as-dev -c .config/yadm/bootstrap 2>&1 || echo "failed: exit $?")
          [ -z "$out" ] && exit 0
          echo "::error title=Second bootstrap is not silent::${out//$'\n'/%0A}"
          exit 1
