name: Claude comment

# Posts or replies as the app's bot when configured; resolve: true also resolves the thread.
on:
  repository_dispatch:
    types: [claude-comment]

permissions:
  issues: write
  pull-requests: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - id: app
        if: ${{ vars.CLAUDE_APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}
      - name: Post
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          REPO: ${{ github.repository }}
        run: |
          number=$(jq -er '.number | numbers' <<<"$PAYLOAD")
          reply_to=$(jq -r '.reply_to // empty | numbers' <<<"$PAYLOAD")
          if [[ -n $reply_to ]]; then
            path="repos/$REPO/pulls/$number/comments/$reply_to/replies"
          else
            path="repos/$REPO/issues/$number/comments"
          fi
          jq -e '{body: (.body | strings)}' <<<"$PAYLOAD" | gh api -X POST "$path" --input -
          [[ -n $reply_to && $(jq -r '.resolve' <<<"$PAYLOAD") == true ]] || exit 0
          # shellcheck disable=SC2016 # GraphQL variables
          thread=$(gh api graphql -F owner="${REPO%/*}" -F name="${REPO#*/}" -F number="$number" -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  reviewThreads(first: 100) { nodes { id comments(first: 1) { nodes { databaseId } } } }
                }
              }
            }' | jq -er --argjson root "$reply_to" \
            '.data.repository.pullRequest.reviewThreads.nodes[] | select(.comments.nodes[0].databaseId == $root) | .id')
          # shellcheck disable=SC2016 # GraphQL variables
          gh api graphql -f thread="$thread" -f query='
            mutation($thread: ID!) { resolveReviewThread(input: {threadId: $thread}) { thread { isResolved } } }'
